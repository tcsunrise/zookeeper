# ======================================================================
# ZooKeeper 3.3.6 完整配置示例（对应 QuorumPeerConfig.parseProperties）
# 当前文件按 server.1 的视角编写：dataDir/myid 内容应为 1
# ======================================================================

# ---------------- 基础配置 ----------------
# 基本时间单位（毫秒），心跳间隔；session 超时默认 2*tickTime ~ 20*tickTime
tickTime=2000
# 快照目录；集群模式下还要求该目录下存在 myid 文件
dataDir=D:/app/temp/zookeeper/zkdata
# 事务日志目录（不配则同 dataDir）；配置时目录必须已存在，否则启动报错
dataLogDir=D:/app/temp/zookeeper/zklog
# 客户端端口
clientPort=2181
# 客户端端口绑定的地址（不配则绑定 0.0.0.0）
clientPortAddress=127.0.0.1

# ---------------- 连接与会话 ----------------
# 单个客户端 IP 的最大连接数，0 表示不限制
maxClientCnxns=60
# 会话超时下限/上限（毫秒），默认 2*tickTime / 20*tickTime
minSessionTimeout=4000
maxSessionTimeout=40000

# ---------------- 集群配置 ----------------
# Follower 初始连接并同步 Leader 的超时（tickTime 的倍数）
initLimit=10
# Follower 与 Leader 心跳同步的超时（tickTime 的倍数）
syncLimit=5
# 选举算法：0=基于 UDP 的 LeaderElection，1/2=AuthFastLeaderElection，3=FastLeaderElection（默认）
electionAlg=3
# 本节点角色：participant（默认）或 observer，需要与下面 server.N 中的类型一致
peerType=participant

# server.<myid>=host:quorumPort[:electionPort[:participant|observer]]
#   quorumPort   : Follower 连接 Leader 同步数据的端口
#   electionPort : 选举端口（electionAlg != 0 时每个 participant 都必须配置）
# 单机伪集群用不同端口区分
server.1=127.0.0.1:2888:3888
server.2=127.0.0.1:2889:3889
server.3=127.0.0.1:2890:3890:participant
server.4=127.0.0.1:2891:3891:observer

# ---------------- 分层 quorum（可选） ----------------
# 配置 group 后使用 QuorumHierarchical 代替默认的 QuorumMaj
# 每个 participant 必须且只能属于一个 group（observer 不要放进 group）
# weight 不配默认为 1
#group.1=1:2
#group.2=3
#weight.1=1
#weight.2=1
#weight.3=1

# ---------------- 其他配置（不认识的 key 会被设置为系统属性 zookeeper.<key>） ----------------
# 写多少条事务后触发一次快照（实际会加随机偏移）
snapCount=100000
# 事务日志文件预分配大小（KB）
preAllocSize=65536
# 全局未处理请求数上限，超过后限流
globalOutstandingLimit=1000
# 写事务日志后是否 fsync 刷盘
forceSync=yes
# Leader 是否也处理客户端连接
leaderServes=yes
# 是否跳过 ACL 检查
skipACL=no
# 选举时建立连接的超时（毫秒），QuorumCnxManager 使用
cnxTimeout=5000
